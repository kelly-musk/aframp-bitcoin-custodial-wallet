[package]
name = "aframp-bitcoin-custodial-wallet"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "aframp-wallet"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
bdk_bitcoind_rpc = "0.22.0"
bdk_wallet = { version = "3.1.0", features = ["rusqlite", "keys-bip39"] }
bip39 = { version = "2.2.2", features = ["rand"] }
bitcoin = "=0.32.102"
bitcoincore-rpc = "0.19.0"
clap = { version = "4.6.6", features = ["derive"] }
dotenvy = "0.15.7"
env_logger = "0.11"
log = "0.4"
minreq = { version = "2.14.1", features = ["https", "json-using-serde"] }
serde = "1.0.229"
